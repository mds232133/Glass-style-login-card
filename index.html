<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030817">
  <title>Neon Portal — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tunnel.css">
  <link rel="stylesheet" href="css/card.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <main class="scene" aria-label="Futuristic login">
    <div class="space-glow" aria-hidden="true"></div>
    <div class="tunnel" id="tunnel" aria-hidden="true">
      <div class="tunnel-halo"></div>
      <div class="portal-ring ring-outer"></div>
      <div class="portal-ring ring-outer-dashes"></div>
      <div class="portal-ring ring-violet"></div>
      <div class="portal-ring ring-cyan"></div>
      <div class="portal-ring ring-inner"></div>
      <div class="portal-ring ring-core"></div>
      <div class="portal-core"></div>
      <div class="tunnel-stars" id="tunnel-stars"></div>
      <div class="portal-rim"></div>
    </div>
    <div class="horizon" aria-hidden="true"></div>
    <div class="floor" aria-hidden="true">
      <i></i><i></i><i></i><i></i>
    </div>
    <div class="ambient-particles" id="ambient-particles" aria-hidden="true"></div>

    <section class="scene-content" aria-live="polite">
      <div class="boot-card glass-card" id="boot-card" aria-hidden="true">
        <div class="boot-code">
          <div class="code-line"><span class="code-prompt">&gt;</span> <span id="typed-code"></span><span class="typing-cursor">_</span></div>
        </div>
      </div>

      <section class="login-card glass-card" id="login-card" aria-labelledby="login-title" inert>
        <div class="card-shine" aria-hidden="true"></div>
        <div class="profile-orbit staged-item" data-stage="profile" aria-hidden="true">
          <div class="orbit-line"></div>
          <div class="profile-icon">
            <svg viewBox="0 0 64 64" role="presentation">
              <circle cx="32" cy="21" r="11"></circle>
              <path d="M10 55c0-12 9-20 22-20s22 8 22 20v2H10z"></path>
            </svg>
          </div>
        </div>
        <h1 class="login-title staged-item" id="login-title" data-stage="title">LOGIN FORM</h1>
        <div class="title-underline staged-item" data-stage="title" aria-hidden="true"></div>

        <form id="login-form" novalidate>
          <label class="input-shell staged-item" data-stage="username">
            <svg class="field-icon user-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="7.5" r="4"></circle><path d="M3.5 21c.2-5 3.4-8 8.5-8s8.3 3 8.5 8z"></path>
            </svg>
            <span class="field-divider" aria-hidden="true"></span>
            <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" aria-label="Username" disabled>
          </label>

          <label class="input-shell password-shell staged-item" data-stage="password">
            <svg class="field-icon lock-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.5 10V7a5.5 5.5 0 0 1 11 0v3"></path><rect x="4" y="10" width="16" height="12" rx="2"></rect><circle cx="12" cy="16" r="1.25"></circle><path d="M12 17.3V19"></path>
            </svg>
            <span class="field-divider" aria-hidden="true"></span>
            <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" disabled>
            <button class="visibility-toggle" id="visibility-toggle" type="button" aria-label="Show password" aria-pressed="false" disabled>
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.7-6 10-6 10 6 10 6-3.7 6-10 6-10-6-10-6z"></path><circle cx="12" cy="12" r="2.7"></circle></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 6.2A10.7 10.7 0 0 1 12 6c6.3 0 10 6 10 6a17 17 0 0 1-3.1 3.7M6.2 6.2C3.5 8 2 12 2 12s3.7 6 10 6c1.1 0 2.1-.2 3-.5"></path></svg>
            </button>
          </label>

          <div class="form-options">
            <label class="remember-option staged-item" data-stage="remember">
              <input id="remember" type="checkbox" checked disabled>
              <span class="custom-check" aria-hidden="true"><svg viewBox="0 0 18 18"><path d="m3 9 4 4 8-9"></path></svg></span>
              <span>Remember Me</span>
            </label>
            <a class="forgot-link staged-item" data-stage="forgot" id="forgot-link" href="#">Forgot Password?</a>
          </div>

          <button class="login-button staged-item" data-stage="button" type="submit" disabled>
            <span>LOGIN</span><svg viewBox="0 0 28 24" aria-hidden="true"><path d="M3 12h19M14 4l8 8-8 8"></path></svg>
          </button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <div class="social-signin">
          <div class="social-caption staged-item" data-stage="social-caption"><span></span><p>or continue with</p><span></span></div>
          <div class="social-buttons">
            <button type="button" class="social-button google staged-item" data-stage="google" aria-label="Continue with Google" disabled>
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15z"></path>
                <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3C9.2 39.5 16 44 24 44z"></path>
                <path fill="#FBBC05" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3z"></path>
                <path fill="#EA4335" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6 29.5 4 24 4 16 4 9.2 8.5 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12z"></path>
              </svg>
            </button>
            <button type="button" class="social-button github staged-item" data-stage="github" aria-label="Continue with GitHub" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.5 21.6c.6.1.8-.3.8-.6v-2.1c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 .1.7 2.4 4.7 1.7.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.5 0-1.2.4-2.1 1.1-2.9-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3 1.1a10.5 10.5 0 0 1 5.5 0c2.1-1.4 3-1.1 3-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.7 1.1 2.9 0 4.2-2.6 5.2-5.1 5.5.4.3.8 1 .8 2v3c0 .3.2.7.8.6A11.1 11.1 0 0 0 12 .9z"></path></svg>
            </button>
            <button type="button" class="social-button facebook staged-item" data-stage="facebook" aria-label="Continue with Facebook" disabled><span>f</span></button>
          </div>
        </div>
      </section>
    </section>
    <p class="sr-only" id="animation-status">Preparing portal</p>
  </main>
  <script src="js/tunnel.js"></script>
  <script src="js/card.js"></script>
  <script src="js/form.js"></script>
  <script src="js/animation-timeline.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
